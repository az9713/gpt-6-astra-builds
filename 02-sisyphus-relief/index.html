function massiveStone(x,y,angle){pen.save();pen.translate(x,y);pen.rotate(angle);let pts=[];for(let i=0;i<26;i++){let a=i*TAU/26,r=128+7*Math.sin(i*1.83)+3*Math.cos(i*3.3);pts.push([Math.cos(a)*r,Math.sin(a)*r])}pen.save();pen.shadowColor='rgba(55,49,35,.28)';pen.shadowOffsetX=11;pen.shadowOffsetY=13;pen.shadowBlur=9;polygon(pts,linear(-90,-100,120,120,[[0,'#f0e0b9'],[.25,'#d4c099'],[.65,'#b09b74'],[1,'#766e54']]),'#918466',3);pen.restore();

function rockPosition(t){if(t<4)return lerp(1128,1210,tween(t,0,4));if(t<9)return lerp(1210,336,Math.pow((t-4)/5,1.7));if(t<11.8)return 336;return lerp(336,1128,tween(t,11.8,20))}

function drawScene(t){let s=sceneState(t);pen.drawImage(masonry,0,0);let bounce=t>4&&t<9?Math.abs(Math.sin((t-4)*9))*Math.sin((t-4)/5*PI)*15:0;oval(s.rockX+26,slope(s.rockX)+13,126,17,'rgba(66,59,40,.27)',-.3);sculptedMan(s.personX,t,s.pushing);massiveStone(s.rockX,slope(s.rockX)-126-bounce,s.rockAngle);
